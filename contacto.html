<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Tienda Álbumes</title>

  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="text-white">
  <!-- MARQUEE -->
  <div class="m-0 rounded-0 text-center alert alert-dismissible fade show pm-marquee-wrap" role="alert">
    <div class="pm-marquee">
      <div class="pm-marquee-track">
        <span class="pm-item"><i class="fas fa-credit-card pm-ico"></i>PAGA HASTA 6 CUOTAS SIN INTERÉS!</span>
        <span class="pm-item"><i class="fas fa-gift pm-ico"></i>5% DCTO EXTRA NUEVOS CLIENTES</span>
        <span class="pm-item"><i class="fas fa-truck pm-ico"></i>ENVÍOS A TODO CHILE</span>
      </div>
    </div>
    <button type="button" class="btn-close btn-close-white me-2" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <!-- NAVEGACIÓN -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">Tienda Álbumes</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="Productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="carrito.html">Carrito de Compras</a></li>
        </ul>
        <div class="auth-buttons">
          <a href="registro.html" class="btn btn-primary">Regístrate</a>
          <a href="login.html" class="btn btn-secondary">Iniciar sesión</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- FORMULARIO CONTACTO -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card bg-dark text-white border-secondary shadow-lg">
          <div class="card-body p-4">
            <h2 class="card-title text-center mb-4">Contáctanos</h2>
            
            <form id="formContacto" onsubmit="procesarContacto(event)">
              <div class="mb-3">
                <label for="contactoNombre" class="form-label">Nombre Completo</label>
                <input type="text" class="form-control bg-dark text-white border-secondary" id="contactoNombre" maxlength="100" required>
              </div>

              <div class="mb-3">
                <label for="contactoCorreo" class="form-label">Correo Electrónico (opcional)</label>
                <input type="email" class="form-control bg-dark text-white border-secondary" id="contactoCorreo" maxlength="100">
                <small class="text-white-50">Si lo ingresas, debe ser @duoc.cl, @profesor.duoc.cl o @gmail.com</small>
              </div>

              <div class="mb-3">
                <label for="contactoComentario" class="form-label">Comentario</label>
                <textarea class="form-control bg-dark text-white border-secondary" id="contactoComentario" rows="4" maxlength="500" required></textarea>
                <small class="text-white-50">Máximo 500 caracteres.</small>
              </div>

              <div id="mensajeErrorContacto" class="alert alert-danger d-none my-3" role="alert"></div>

              <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Enviar Mensaje</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>
