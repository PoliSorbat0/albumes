<!DOCTYPE html>
<!-- Declaración del tipo de documento HTML5 -->
<html lang="es">
<head>
  <!-- Configuración de la codificación de caracteres en UTF-8 para admitir tildes y caracteres especiales -->
  <meta charset="UTF-8">
  <!-- Escala inicial y diseño responsivo para dispositivos móviles y distintas resoluciones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras - ViniLove</title>

  <!-- CDN de Bootstrap 5, hojas de estilo personalizadas y librería de íconos FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<!-- La clase 'text-white' aplica un color de texto blanco general a todo el cuerpo -->
<body class="text-white">

  <!-- BARRA SUPERIOR DE ANUNCIOS (Marquee) -->
  <div class="m-0 rounded-0 text-center alert alert-dismissible fade show pm-marquee-wrap" role="alert">
    <div class="pm-marquee">
      <!-- Pista que desplaza los mensajes promocionales mediante animación CSS -->
      <div class="pm-marquee-track">
        <span class="pm-item"><i class="fas fa-credit-card pm-ico"></i>PAGA HASTA 6 CUOTAS SIN INTERÉS!</span>
        <span class="pm-item"><i class="fas fa-gift pm-ico"></i>5% DCTO EXTRA NUEVOS CLIENTES</span>
        <span class="pm-item"><i class="fas fa-truck pm-ico"></i>ENVÍOS A TODO CHILE</span>
      </div>
    </div>
    <!-- Botón para descartar el anuncio -->
    <button type="button" class="btn-close btn-close-white me-2" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <!-- NAVEGACIÓN -->
  <!-- Barra de navegación principal de la aplicación con estilo oscuro y sombras -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">
        <img src="imagenes/LogoViniLove.png" alt="ViniLove" class="navbar-logo">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="Productos.html">Productos</a></li>
          <!-- Enlace resaltado como activo ('active') indicando la sección actual -->
          <li class="nav-item"><a class="nav-link active" href="carrito.html">Carrito de Compras</a></li> 
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownAbout" role="button" data-bs-toggle="dropdown">¡Sobre Nosotros!</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="Lore.html">Nuestra Historia</a></li>
              <li><a class="dropdown-item" href="contacto.html">Contáctanos</a></li>
            </ul>
          </li>
        </ul>
        <!-- Botones de autenticación en la esquina superior derecha -->
        <div class="auth-buttons">
          <a href="registro.html" class="btn btn-primary">Regístrate</a>
          <a href="login.html" class="btn btn-secondary">Iniciar sesión</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- SECCIÓN PRINCIPAL DEL CARRITO -->
  <main class="container my-5">
    <h1 class="mb-4 text-center fw-bold">Tu Carrito de Compras</h1>

    <div class="row g-4">
      <!-- Columna izquierda: Lista e ítems del carrito -->
      <div class="col-lg-8">
        <div class="card bg-dark text-white border-secondary shadow">
          <div class="card-body">
            <!-- Div contenedor donde JS inyecta dinámicamente la tabla con los ítems añadidos -->
            <div id="tabla-carrito-contenedor" class="table-responsive">
              <!-- La tabla se renderiza dinámicamente con JS -->
            </div>
          </div>
        </div>
      </div>

      <!-- Columna derecha: Resumen del Pedido y Acciones de compra -->
      <div class="col-lg-4">
        <div class="card bg-dark text-white border-secondary shadow">
          <div class="card-body">
            <h4 class="card-title fw-bold mb-3 border-bottom border-secondary pb-2">Resumen de Compra</h4>
            
            <div class="d-flex justify-content-between mb-2">
              <span class="text-white-50">Subtotal:</span>
              <!-- ID para actualizar el subtotal mediante JavaScript -->
              <span id="resumen-subtotal" class="fw-bold">$0</span>
            </div>
            <div class="d-flex justify-content-between mb-3">
              <span class="text-white-50">Envío:</span>
              <span class="text-success fw-bold">GRATIS</span>
            </div>
            
            <hr class="border-secondary">
            
            <div class="d-flex justify-content-between mb-4 fs-5">
              <strong>Total:</strong>
              <!-- ID para actualizar el monto total definitivo mediante JavaScript -->
              <strong id="resumen-total" class="text-primary">$0</strong>
            </div>

            <!-- Botón para ejecutar la función de pago -->
            <button onclick="finalizarCompra()" class="btn btn-primary w-100 btn-lg mb-2">
              Proceder al Pago
            </button>
            <!-- Botón para vaciar los ítems del carrito -->
            <button onclick="vaciarCarrito()" class="btn btn-outline-danger w-100 btn-sm">
              Vaciar Carrito
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts: Bootstrap 5 JS Bundle y la lógica del carrito de compras -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/carrito.js"></script>
  <script>
    // Cargar y construir la vista completa al finalizar de cargar el DOM de la página
    document.addEventListener("DOMContentLoaded", () => {
      renderizarPaginaCarrito();
    });
  </script>
</body>
</html>
